name: Data Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas fastparquet boto3 sqlalchemy psycopg2-binary python-dotenv

    - name: Create temporary .env
      run: |
        echo "POSTGRES_USER=postgres" >> .env
        echo "POSTGRES_PASSWORD=postgres" >> .env
        echo "POSTGRES_DB=postgres" >> .env
        echo "POSTGRES_HOST=localhost" >> .env
        echo "POSTGRES_PORT=5432" >> .env
        echo "S3_ENDPOINT_URL=http://localhost:9000" >> .env

    - name: Start Docker Infrastructure
      run: |
        docker compose up -d minio postgres
        sleep 15

    - name: Test Pipeline Execution
      run: |
        python -m src.ingestion.extract_data
        python -m src.ingestion.load_staging
