services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./sql/ddl/01_create_schema.sql:/docker-entrypoint-initdb.d/01_create_schema.sql:ro
      - ./sql/ddl/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql:ro
      - ./sql/ddl/03_create_indexes.sql:/docker-entrypoint-initdb.d/03_create_indexes.sql:ro

      - ./sql/staging/01_stg_customers.sql:/docker-entrypoint-initdb.d/04_stg_customers.sql:ro
      - ./sql/staging/02_stg_products.sql:/docker-entrypoint-initdb.d/05_stg_products.sql:ro
      - ./sql/staging/03_stg_orders.sql:/docker-entrypoint-initdb.d/06_stg_orders.sql:ro
      - ./sql/staging/04_stg_order_items.sql:/docker-entrypoint-initdb.d/07_stg_order_items.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce_pipeline

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_init

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - bash
      - -c
      - |
        airflow db migrate

    restart: "no"


  airflow-api-server:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_api

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    command:
      - airflow
      - api-server

    restart: unless-stopped


  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_scheduler

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      - airflow
      - scheduler

    restart: unless-stopped


  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_dag_processor

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      - airflow
      - dag-processor

    restart: unless-stopped


  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce_airflow_triggerer

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command:
      - airflow
      - triggerer

    restart: unless-stopped


volumes:
  postgres_data: